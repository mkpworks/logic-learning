<svg xmlns="http://www.w3.org/2000/svg" width="960" height="400" viewBox="0 0 960 400" role="img" aria-labelledby="title desc">
  <title id="title">One zone with two modes</title>
  <desc id="desc">A zone groups the same three knobs. Mode A maps them to cutoff, resonance, and attack. Mode B maps them to volume, pan, and send. Only the active mode is used. A mode-change button switches modes.</desc>
  <rect width="960" height="400" rx="16" fill="#f6f3ee"/>
  <g font-family="ui-sans-serif, system-ui, sans-serif" fill="#1e2832">
    <text x="36" y="42" font-size="18" font-weight="650">One zone, two modes</text>
    <text x="36" y="64" font-size="13" fill="#5c6770">Only the active mode is processed. The other mode is ignored until you switch.</text>

    <rect x="36" y="96" width="180" height="250" rx="12" fill="#fff" stroke="#3d5a80"/>
    <text x="126" y="128" font-size="15" text-anchor="middle" font-weight="650">Zone</text>
    <text x="126" y="150" font-size="12" text-anchor="middle" fill="#5c6770">the same three knobs</text>
    <circle cx="86" cy="210" r="16" fill="#9a4e32"/>
    <circle cx="126" cy="210" r="16" fill="#9a4e32"/>
    <circle cx="166" cy="210" r="16" fill="#9a4e32"/>
    <text x="126" y="260" font-size="12" text-anchor="middle" fill="#3d4a57">knob 1  2  3</text>
    <rect x="58" y="286" width="136" height="36" rx="8" fill="#3d5a80"/>
    <text x="126" y="309" font-size="12" text-anchor="middle" fill="#fff">Mode change</text>

    <rect x="280" y="96" width="300" height="250" rx="12" fill="#fff" stroke="#9a4e32" stroke-width="2"/>
    <text x="300" y="128" font-size="15" font-weight="650">Mode A · active</text>
    <text x="300" y="152" font-size="12" fill="#5c6770">synth parameters</text>
    <text x="300" y="196" font-size="14">Knob 1 → cutoff</text>
    <text x="300" y="226" font-size="14">Knob 2 → resonance</text>
    <text x="300" y="256" font-size="14">Knob 3 → attack</text>

    <rect x="620" y="96" width="300" height="250" rx="12" fill="#fff" stroke="#e2ddd4"/>
    <text x="640" y="128" font-size="15" font-weight="650" fill="#8a847c">Mode B · ignored</text>
    <text x="640" y="152" font-size="12" fill="#8a847c">mixer parameters</text>
    <text x="640" y="196" font-size="14" fill="#8a847c">Knob 1 → volume</text>
    <text x="640" y="226" font-size="14" fill="#8a847c">Knob 2 → pan</text>
    <text x="640" y="256" font-size="14" fill="#8a847c">Knob 3 → send</text>
  </g>
</svg>
